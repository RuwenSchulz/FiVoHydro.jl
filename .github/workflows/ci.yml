name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          # Keep in sync with Manifest.toml (julia_version = 1.11.x)
          version: '1.11'

      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'

      # Pkg.test() above runs the unit tests plus the 1-D ladder's fast tier (gates T and A4, wired
      # into test/runtests.jl); it does not touch src2d/ or main2D.jl at all. This step is the fast
      # tier of the 2-D ladder — shear-closure algebra, primitive recovery, recovery against the 1-D
      # forward map on the production locus, and the three charm/term gates (~30 s). It is a SMOKE
      # TEST, not the validation ladder: it exercises no fluxes on a physical IC and no regulators.
      # The two full ladders stay manual —
      #   julia -t auto --project=. test/run1d_gates.jl      # 10 gates, ~8 min
      #   julia -t auto --project=. test/run2d_gates.jl      # 22 gates, ~30 min
      # Run them after touching src/ or src2d/. See README.md §5, README2D.md §5, TWOD_PROGRAM.md §6.
      - name: Run 2-D gates (fast tier)
        run: FIVO2D_TIER=fast julia -t auto --project=. test/run2d_gates.jl
